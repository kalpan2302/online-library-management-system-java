spring.application.name=backend

spring.datasource.url=jdbc:mysql
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

#enhanced JwtUtil to reads secret from properties and exposes getUserId()).
security.jwt.expiration-ms=86400000
security.jwt.clock-skew-sec=60


security.jwt.secret=

olms.loans.max-active=3
olms.loans.default-days=14
olms.fines.block-on-unpaid=true

# Timezone for job and "today"
app.notify.time-zone=Asia/Kolkata

# Due-soon window and whether to include today
app.notify.due-soon-days=2
app.notify.due-soon-include-today=true

# Overdue reminders, de-dup horizon
app.notify.overdue-reminder-days=1,3,7,14
app.notify.dedup-hours=24

# Fine recomputation every minute
app.fine.cron=0 * * * * *

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=a
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# optional but useful
#app.mail.from=
app.verification.expiry-hours=48
# If startup fails whenever Gmail blocks: uncomment to mute mail health check
# management.health.mail.enabled=false


logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=INFO

app.frontend.base-url=
SPRING_PROFILES_ACTIVE=dev


app.cors.allowed-origins=http://localhost:4200
